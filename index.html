    <script>
      // Suprime avisos benignos de websocket/HMR do cliente Vite e fallbacks no ambiente em sandbox
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        var _info = console.info;
        var _log = console.log;
        var _debug = console.debug;
        var isBenignMsg = function(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') {
            if (arg.indexOf('[vite]') !== -1 || arg.indexOf('Failed to fetch') !== -1 || arg.indexOf('websocket') !== -1) {
              return true;
            }
          }
          if (typeof arg === 'object') {
            try {
              var s = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg);
              if (s.indexOf('[vite]') !== -1 || s.indexOf('Failed to fetch') !== -1 || s.indexOf('websocket') !== -1) {
                return true;
              }
            } catch (e) {}
          }
          return false;
        };
        var shouldSuppress = function(args) {
          for (var i = 0; i < args.length; i++) {
            if (isBenignMsg(args[i])) return true;
          }
          return false;
        };
        console.error = function() {
          if (shouldSuppress(arguments)) return;
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          return _warn.apply(console, arguments);
        };
        console.info = function() {
          if (shouldSuppress(arguments)) return;
          return _info.apply(console, arguments);
        };
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          return _log.apply(console, arguments);
        };
        if (_debug) {
          console.debug = function() {
            if (shouldSuppress(arguments)) return;
            return _debug.apply(console, arguments);
          };
        }
        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('Failed to fetch') !== -1 || e.message.indexOf('websocket') !== -1)) ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1)
          )) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            try {
              var r = String(e.reason.message || e.reason);
              if (r.indexOf('[vite]') !== -1 || r.indexOf('Failed to fetch') !== -1) {
                e.preventDefault();
                e.stopPropagation();
              }
            } catch (err) {}
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('nap_theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            // Padrão do sistema: Claro Corporativo (Daylight)
            isDark = false;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

      body {

        color: #f1f5f9;

      html.light body {
