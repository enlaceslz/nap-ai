    <script>
      // Suprime avisos benignos de websocket/HMR do cliente Vite no ambiente em sandbox
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        var _info = console.info;
        var _log = console.log;
        var isViteHmrMsg = function(arg) {
          if (typeof arg === 'string' && (arg.indexOf('[vite] failed to connect to websocket') !== -1 || arg.indexOf('[vite] connecting...') !== -1 || (arg.indexOf('[vite]') !== -1 && arg.indexOf('websocket') !== -1))) {
            return true;
          }
          return false;
        };
        console.error = function() {
          if (isViteHmrMsg(arguments[0])) return;
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteHmrMsg(arguments[0])) return;
          return _warn.apply(console, arguments);
        };
        console.info = function() {
          if (isViteHmrMsg(arguments[0])) return;
          return _info.apply(console, arguments);
        };
        console.log = function() {
          if (isViteHmrMsg(arguments[0])) return;
          return _log.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('[vite] failed to connect to websocket') !== -1 || (e.message.indexOf('[vite]') !== -1 && e.message.indexOf('websocket') !== -1))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('nap_theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            // Padrão do sistema: Claro Corporativo (Daylight)
            isDark = false;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body {

      html.dark body {

        color: #f1f5f9;

      html.light body {
