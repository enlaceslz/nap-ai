<!doctype html>

  <head>
    <script>
      // Suprime avisos benignos de websocket/HMR do cliente Vite no ambiente sandboxed do AI Studio
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        var _info = console.info;
        var _log = console.log;
        var _debug = console.debug;
        var isBenign = function(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') {
            if (/\[vite\]|vite|websocket|Failed to fetch/i.test(arg)) return true;
          }
          if (typeof arg === 'object') {
            try {
              var s = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '') + ' ' + (arg.type || '') + ' ' + String(arg);
              if (/\[vite\]|vite|websocket|Failed to fetch/i.test(s)) return true;
              if (arg.target && String(arg.target).indexOf('WebSocket') !== -1) return true;
              if (arg instanceof Event && (arg.type === 'error' || arg.type === 'close')) return true;
            } catch (e) {}
          }
          return false;
        };
        var shouldSuppress = function(args) {
          for (var i = 0; i < args.length; i++) {
            if (isBenign(args[i])) return true;
          }
          return false;
        };
        console.error = function() {
          if (shouldSuppress(arguments)) return;
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          return _warn.apply(console, arguments);
        };
        console.info = function() {
          if (shouldSuppress(arguments)) return;
          return _info.apply(console, arguments);
        };
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          return _log.apply(console, arguments);
        };
        if (_debug) {
          console.debug = function() {
            if (shouldSuppress(arguments)) return;
            return _debug.apply(console, arguments);
          };
        }
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isBenign(msg) || isBenign(url) || isBenign(error)) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
        };
        window.addEventListener('error', function(e) {
          if (!e) return;
          if (isBenign(e.message) || isBenign(e.filename) || isBenign(e.error) || (e.filename && e.filename.indexOf('@vite') !== -1)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (!e) return;
          if (isBenign(e.reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('nap_theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            // Padrão do sistema: Claro Corporativo (Daylight)
            isDark = false;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark body {
        background-color: #0b0f19;
        color: #f1f5f9;
      }
      html.light body {
        background-color: #f4f6fa;
        color: #1e293b;
      }
