version: '3.8'

services:
  # ==========================================
  # 1. NAP: Backend + Frontend (Omnichannel)
  # ==========================================
  nap-app:
    build: .
    container_name: nap_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/genieacs}
      - JWT_SECRET=${JWT_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - ERP_URL=${ERP_URL}
      - ERP_APP=${ERP_APP}
      - ERP_TOKEN=${ERP_TOKEN}
    depends_on:
      - db
      - redis
      - mongo
    networks:
      - nap_internal_network

  # ==========================================
  # 2. Banco de Dados Relacional (NAP / CRM)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: nap_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nap_crm}
    ports:
      # Somente acessível internamente ou via localhost na VPS
      - "127.0.0.1:5432:5432"
    volumes:
      - nap_pg_data:/var/lib/postgresql/data
    networks:
      - nap_internal_network

  # ==========================================
  # 3. GenieACS: Dependências (MongoDB & Redis)
  # ==========================================
  mongo:
    image: mongo:6.0
    container_name: genieacs_mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - genieacs_mongo_data:/data/db
    networks:
      - nap_internal_network

  redis:
    image: redis:7-alpine
    container_name: genieacs_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - genieacs_redis_data:/data
    networks:
      - nap_internal_network

  # ==========================================
  # 4. GenieACS: Serviços Principais
  # ==========================================
  genieacs-cwmp:
    image: genieacs/genieacs:1.2.12
    container_name: genieacs_cwmp
    restart: always
    command: ["genieacs-cwmp"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=${MONGODB_URI:-mongodb://mongo:27017/genieacs}
      - GENIEACS_REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "7547:7547" # Porta TR-069 pública para ONUs dos clientes
    depends_on:
      - mongo
      - redis
    networks:
      - nap_internal_network

  genieacs-nbi:
    image: genieacs/genieacs:1.2.12
    container_name: genieacs_nbi
    restart: always
    command: ["genieacs-nbi"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=${MONGODB_URI:-mongodb://mongo:27017/genieacs}
      - GENIEACS_REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:7557:7557" # API privada do GenieACS
    depends_on:
      - mongo
      - redis
    networks:
      - nap_internal_network

  genieacs-fs:
    image: genieacs/genieacs:1.2.12
    container_name: genieacs_fs
    restart: always
    command: ["genieacs-fs"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=${MONGODB_URI:-mongodb://mongo:27017/genieacs}
      - GENIEACS_REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "7567:7567" # File Server (Firmwares)
    depends_on:
      - mongo
      - redis
    networks:
      - nap_internal_network

  genieacs-ui:
    image: genieacs/genieacs:1.2.12
    container_name: genieacs_ui
    restart: always
    command: ["genieacs-ui"]
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=${MONGODB_URI:-mongodb://mongo:27017/genieacs}
      - GENIEACS_REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GENIEACS_UI_JWT_SECRET=${GENIEACS_UI_JWT_SECRET}
    ports:
      - "127.0.0.1:3005:3000" # Interface GenieACS bindada apenas em localhost
    depends_on:
      - mongo
      - redis
    networks:
      - nap_internal_network

networks:
  nap_internal_network:
    driver: bridge

volumes:
  nap_pg_data:
  genieacs_mongo_data:
  genieacs_redis_data:
