; ====================================================================
; NAP TELECOM - DIALPLAN (EXTENSIONS.CONF)
; ====================================================================

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[from-external]
; Todas as chamadas de operadoras (troncos) caem aqui e são enviadas ao NAP via ARI
exten => _X.,1,NoOp(Chamada Externa Entrante - Roteando para IA NAP)
exten => _X.,n,Stasis(nap_engine)
exten => _X.,n,Hangup()

[from-internal]
; Chamadas originadas por ramais internos (operadores via WebRTC)
exten => _X.,1,NoOp(Chamada Interna/Saida - Roteando para IA NAP)
exten => _X.,n,Stasis(nap_engine)
exten => _X.,n,Hangup()
